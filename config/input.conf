# input.conf - mpv-adaptive-enhance key bindings (installed by install.ps1)
#
# Rules learned the hard way:
# * Shader lists are joined with ';' on Windows, never ':' - every absolute path starts with
#   'C:', and a ':'-joined pair is read as one filename and loads nothing, silently.
# * Paths are absolute (@MPV_DIR@ is filled in by install.ps1): under mpv.net, ~~/ points at
#   a folder that has no shaders/.
# * Every command must stay on one line; input.conf has no line continuation.

# ---- the menu ----
TAB script-message adaptive-menu                    #menu: Enhancement > Menu: video type / level / interpolation / stream / stats  (Tab)
` script-message adaptive-overlay                   #menu: Enhancement > Live stats overlay  (`)

# ---- streams (reload at the current position) ----
CTRL+1 script-message ytdl-mode quality   # stream: auto resolution up to 4K, follows bandwidth
CTRL+2 script-message ytdl-mode motion    # stream: <=1080p30 so RIFE x2 can engage

# ---- content type: overrides the automatic shader choice for this file ----
ALT+a script-message adaptive-content anime    # anime / 3D render: ArtCNN
ALT+l script-message adaptive-content live     # live action: ravu-zoom / sharpen, no CNN
ALT+g script-message adaptive-content grainy   # grainy / low bitrate: ArtCNN denoise
ALT+u script-message adaptive-content auto     # back to automatic

# ---- enhancement ----
CTRL+r script-message adaptive-rife     # RIFE: off -> auto -> on (heavy; mpv.exe only, freezes mpv.net)
CTRL+s script-message adaptive-toggle   # all enhancement off / back to auto (A/B compare)
CTRL+R script-message adaptive-reset    # forget the learned "too heavy" limit for this source/display
CTRL+d cycle deband

# ---- manual shader A/B (puts the file in manual mode until Alt+u) ----
ALT+0 set glsl-shaders "" ; show-text "shaders: OFF" 2000
ALT+1 set glsl-shaders "@MPV_DIR@/shaders/KrigBilateral.glsl" ; show-text "1: chroma only (KrigBilateral)" 2000
ALT+2 set glsl-shaders "@MPV_DIR@/shaders/CfL_Prediction.glsl;@MPV_DIR@/shaders/CAS.glsl" ; show-text "2: chroma (CfL) + CAS sharpen (1:1 only)" 2500
ALT+3 set glsl-shaders "@MPV_DIR@/shaders/KrigBilateral.glsl;@MPV_DIR@/shaders/adaptive-sharpen.glsl" ; show-text "3: chroma + adaptive-sharpen (downscaling)" 2500
ALT+4 set glsl-shaders "@MPV_DIR@/shaders/CfL_Prediction.glsl;@MPV_DIR@/shaders/ravu-zoom-ar-r3.hook" ; show-text "4: chroma (CfL) + ravu-zoom (upscaling)" 2500
ALT+5 set glsl-shaders "@MPV_DIR@/shaders/CfL_Prediction.glsl;@MPV_DIR@/shaders/ArtCNN_C4F16.glsl" ; show-text "5: chroma (CfL) + ArtCNN C4F16 (upscaling >1.3x)" 2500
ALT+6 set glsl-shaders "@MPV_DIR@/shaders/CfL_Prediction.glsl;@MPV_DIR@/shaders/ArtCNN_C4F16_DN.glsl" ; show-text "6: chroma (CfL) + ArtCNN C4F16 denoise (upscaling >1.3x)" 2500

# ---- readouts ----
CTRL+i show-text "${user-data/adaptive/status}\nsrc ${width}x${height} @${container-fps}fps -> out ${estimated-vf-fps}fps | hwdec ${hwdec-current} | dropped ${frame-drop-count} delayed ${vo-delayed-frame-count} | cache ${demuxer-cache-duration}s" 6000
CTRL+SHIFT+i show-text "shaders: ${glsl-shaders}" 8000
CTRL+p script-binding stats/display-stats-toggle
