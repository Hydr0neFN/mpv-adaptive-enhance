# mpv.conf - mpv-adaptive-enhance baseline (installed by install.ps1)
#
# Shader and frame-interpolation choices are made per file, live, by
# scripts-adaptive/adaptive-enhance.lua; stream resolution by ytdl-adaptive.lua.
# This file only sets the safe baseline those scripts start from.
# @MPV_DIR@ is replaced with the absolute config path by install.ps1 (absolute on purpose:
# mpv.net's config dir is a different folder, so ~~/ would not find these files there).

vo=gpu-next,gpu
gpu-api=vulkan
hwdec=auto-safe
profile=high-quality

# Fallback shader if the scripts are missing: chroma reconstruction (helps at every scale,
# because 4:2:0 video stores chroma at half resolution).
glsl-shaders="@MPV_DIR@/shaders/KrigBilateral.glsl"

# --- scalers ---
scale=ewa_lanczossharp
dscale=catmull_rom
# ewa_lanczossoft has no libplacebo equivalent under gpu-next; ewa_lanczos does.
cscale=ewa_lanczos
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# --- debanding: low-bitrate streams band visibly in gradients ---
deband=yes
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=32

dither-depth=auto

# --- motion: smooth 24/30 fps content on high-refresh panels (frame blending, free) ---
video-sync=display-resample
interpolation=yes
tscale=oversample

# --- streaming via yt-dlp ---
ytdl=yes
ytdl-format=bestvideo[height<=?2160][vcodec^=vp9]+bestaudio/bestvideo[height<=?2160]+bestaudio/best
cache=yes
demuxer-max-bytes=512MiB
demuxer-readahead-secs=30
# when the cache runs dry, refill 3 s before resuming instead of stuttering every second
cache-pause-wait=3
# No extractor-args: which YouTube player client works changes per video and per yt-dlp
# release. ytdl-adaptive.lua retries a failed open with web_embedded, then tv, then mweb.

keep-open=yes
screenshot-format=png

# --- adaptive enhancement ---
# Loaded with script= from a folder outside scripts/, so mpv and mpv.net sharing this
# folder never load them twice.
script=@MPV_DIR@/scripts-adaptive/adaptive-enhance.lua
script=@MPV_DIR@/scripts-adaptive/ytdl-adaptive.lua
